name: Release

on:
  push:
    tags: ["v*"]
  # 手动触发只构建并上传 artifact,不创建 release;用于验证打包链路
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.3
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: dtolnay/rust-toolchain@1.84.0
        with:
          components: rustfmt
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm check
      # 未签名构建：不做 Apple 签名与公证。用户首次打开需按 README「下载与安装」放行。
      - run: pnpm tauri build --ci
      - name: Rename DMG with ref
        run: |
          dmg=$(ls src-tauri/target/release/bundle/dmg/*.dmg | head -1)
          mv "$dmg" "src-tauri/target/release/bundle/dmg/EasyPackage-${GITHUB_REF_NAME}-macos.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: src-tauri/target/release/bundle/dmg/*.dmg
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          draft: true
          generate_release_notes: true
          body: |
            > ⚠️ 此版本未做 Apple 签名与公证。macOS 首次打开会被 Gatekeeper 拦截：
            > 在「系统设置 → 隐私与安全性」点击「仍要打开」，或执行
            > `xattr -d com.apple.quarantine "/Applications/Easy Package.app"`。
          files: src-tauri/target/release/bundle/dmg/*.dmg
