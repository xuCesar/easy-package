name: Quality

on:
  push:
    branches: [develop]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.3
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: dtolnay/rust-toolchain@1.84.0
        with:
          components: rustfmt
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm check

  desktop-build:
    # PR 上只跑 check。原生 release 构建约 3–5 分钟，对文档/UI 改动收益低。
    # develop 推送、手动触发仍构建，发布走 release.yml。
    if: github.event_name != 'pull_request'
    needs: check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.3
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: dtolnay/rust-toolchain@1.84.0
        with:
          components: rustfmt
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:desktop
