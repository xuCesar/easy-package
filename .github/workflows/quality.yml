name: Quality

on:
  push:
    branches: [develop]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@1.84.0
        with:
          components: rustfmt
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  desktop-build:
    needs: check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@1.84.0
        with:
          components: rustfmt
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:desktop

  e2e:
    needs: [check, desktop-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # Linux Tauri 的目标依赖使用 Rust 2024 manifest 与 Rust 1.88 才稳定的 let-chains。
      # macOS 的 check 与原生构建仍固定在 1.84，以持续验证项目声明的最低 Rust 版本。
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev xvfb
      - uses: actions/cache@v4
        id: tauri-driver-cache
        with:
          path: ~/.cargo/bin/tauri-driver
          key: ${{ runner.os }}-tauri-driver-v2
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - if: steps.tauri-driver-cache.outputs.cache-hit != 'true'
        run: cargo install tauri-driver --locked
      - run: xvfb-run --auto-servernum pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tauri-e2e-artifacts
          path: output/playwright/
          if-no-files-found: ignore
